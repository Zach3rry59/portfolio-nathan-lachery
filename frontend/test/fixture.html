<!doctype html><html lang="fr"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TEST ISOLÉ — Portfolio</title><body data-profile="dev"><div id="root"></div><script type="module">
if (import.meta.env.MODE !== 'test') throw new Error('Fixtures réservées au serveur test sur le port 5174.');
const { referenceProjects } = await import('../../shared/projects.js');
const scenario = new URLSearchParams(location.search).get('api') || 'normal';
const data = structuredClone(referenceProjects);
if (scenario === 'xss') data[0].title = '<img src=x onerror=alert(1)>';
if (scenario === 'industry') { data[0].category='industry'; data[0].title='[TEST ISOLÉ] Industrie'; }
window.alert = () => { document.body.dataset.xssExecuted = 'true'; };
window.fetch = async (input, options = {}) => {
  const url = new URL(String(input), location.href);
  if (options.method && options.method !== 'GET') throw new Error('Écritures interdites dans les fixtures.');
  if (!url.pathname.endsWith('/projects')) throw new Error('Réseau réel interdit dans les fixtures.');
  if (scenario === 'offline') throw new Error('Panne simulée');
  if (scenario === 'loading') await new Promise(resolve => setTimeout(resolve, 1200));
  const result = scenario === 'empty' ? [] : data.filter(project => project.category === url.searchParams.get('category'));
  return new Response(JSON.stringify({ data:result, meta:{source:'test'} }), { status:200, headers:{'Content-Type':'application/json'} });
};
await import('/src/main.jsx');
</script></body></html>
