<!doctype html><html lang="fr"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tests ciblés du Portfolio</title>
<style>body{margin:24px;font:14px system-ui;background:#0b101b;color:#e7efff}button{padding:12px;cursor:pointer}iframe{width:100%;height:760px;border:1px solid #526;margin-top:20px}pre{white-space:pre-wrap;line-height:1.6}</style>
<h1>Tests isolés du Portfolio</h1><button id="run">Lancer les vérifications ciblées</button><pre id="report" role="status">Prêt. Aucun accès au backend réel.</pre><iframe id="app" title="Fixture isolée" src="about:blank"></iframe>
<script type="module">
if(import.meta.env.MODE!=='test') throw new Error('Utiliser pnpm test:preview (port 5174).');
const frame=document.querySelector('#app'), output=document.querySelector('#report');
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function until(check){const start=performance.now();while(!check()){if(performance.now()-start>6000)throw new Error('Délai dépassé');await pause(25);}}
document.querySelector('#run').onclick=async event=>{
 event.target.disabled=true;const lines=[], saved=localStorage.getItem('animationPreference');
 const cache=()=>JSON.stringify(Object.keys(localStorage).filter(k=>k.startsWith('publicProjects')).sort().map(k=>[k,localStorage.getItem(k)]));
 const before=cache();let doc,win;
 const log=(ok,text)=>{lines.push(`${ok?'OK':'ÉCHEC'} — ${text}`);output.textContent=lines.join('\n');};
 const load=async scenario=>{frame.src=`/test/fixture.html?api=${scenario}`;await new Promise(resolve=>frame.onload=resolve);doc=frame.contentDocument;win=frame.contentWindow;await until(()=>doc.querySelector('.cinema-stage'));};
 const click=s=>doc.querySelector(s).click();
 const index=()=>Number(doc.querySelector('.project-carousel').dataset.projectIndex);
 try{
  localStorage.setItem('animationPreference','reduced');
  await load('loading');log(!doc.querySelector('a[href="#portfolio"]'),'Aucun flash Portfolio pendant le chargement');
  await until(()=>doc.querySelector('.project-carousel'));
  click('#navigation a[href="#portfolio"]');await until(()=>doc.querySelector('.cinema-stage').dataset.activeScene==='portfolio');
  log(doc.querySelector('.carousel-current h3').textContent==='Gestion de clés','SOFIP Dev en premier selon order');
  click('[aria-label="Projet suivant"]');await until(()=>index()===1);
  log(doc.querySelector('.carousel-current h3').textContent==='Portfolio interactif full-stack','Portfolio réel en second');
  await pause(30);click('[aria-label="Projet suivant"]');await until(()=>index()===0);log(true,'Boucle avant dernier → premier');
  await pause(30);click('[aria-label="Projet précédent"]');await until(()=>index()===1);log(true,'Boucle arrière premier → dernier');
  await pause(30);doc.querySelector('.project-carousel').dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true}));await until(()=>index()===0);
  log(doc.querySelector('.cinema-stage').dataset.activeScene==='portfolio','Clavier : projet suivant sans changer de scène');
  click('#profile-toggle');await until(()=>doc.body.dataset.profile==='industrie');await pause(80);
  log(!doc.querySelector('[data-scene="portfolio"]')&&!doc.querySelector('a[href="#portfolio"]')&&!doc.querySelector('[aria-label*="Portfolio"]'),'Industrie vide : aucune scène ni navigation Portfolio');
  log(doc.querySelector('.cinema-stage').dataset.activeScene==='contact','Bascule depuis Portfolio vers Contact');
  await load('industry');await until(()=>doc.querySelector('.project-carousel'));
  log(doc.querySelector('.project-carousel').dataset.carouselCount==='1'&&!doc.querySelector('.carousel-controls'),'Un seul projet : grande carte sans flèches');
  await load('xss');await until(()=>doc.querySelector('.project-carousel'));click('#navigation a[href="#portfolio"]');await pause(100);
  log(doc.querySelector('.carousel-current h3').textContent==='<img src=x onerror=alert(1)>'&&!doc.querySelector('img[src="x"]')&&!doc.body.dataset.xssExecuted,'Payload XSS affiché comme texte, jamais exécuté');
  log(cache()===before,'Fixtures sans modification du cache public');
 }catch(error){log(false,error.message);}finally{
  if(saved===null)localStorage.removeItem('animationPreference');else localStorage.setItem('animationPreference',saved);
  frame.src='about:blank';event.target.disabled=false;
  output.dataset.result=lines.some(line=>line.startsWith('ÉCHEC'))?'failed':'passed';
 }
};
</script></html>
