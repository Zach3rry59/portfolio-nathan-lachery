name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8
        ports: ["27018:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run test:integration
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27018/portfolio_test
      - run: pnpm run build
      - run: pnpm audit --audit-level high
      - name: Build and run Docker with MongoDB
        run: docker compose up --build -d --wait
      - run: node scripts/check-api.mjs
      - name: Verify unprivileged runtime
        run: test "$(docker compose exec -T backend id -u)" != "0"
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
